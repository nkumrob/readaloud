<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-->
<style>
<!--FONTS-->
:root{
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --e:cubic-bezier(.22,.8,.28,1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --bg:#08090a; --bg-2:#0d0f11; --line:#1b1f22; --line-2:#2a2f34;
  --fg:#f2f5f6; --fg-2:#8d979e; --fg-3:#565f66; --signal:#ccff33; --signal-ink:#08090a;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2ef; --bg-2:#ffffff; --line:#e0e0da; --line-2:#cbcbc3;
    --fg:#0c0d0e; --fg-2:#5a6067; --fg-3:#9aa0a6; --signal:#3f6d00; --signal-ink:#fff;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;
  min-height:100dvh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--fg-2);text-decoration:none;border-bottom:1px solid var(--line-2);
  padding-bottom:1px;transition:color .2s,border-color .2s}
a:hover{color:var(--signal);border-color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
::selection{background:var(--signal);color:var(--signal-ink)}

.head{display:flex;align-items:center;gap:var(--s5);padding:var(--s5) var(--s8);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.mark{font-size:17px;font-weight:900;letter-spacing:.28em;line-height:1;border:0;color:var(--fg)}
.mark:hover{color:var(--fg);border:0}
.mark i{color:var(--signal);font-style:normal}
.head nav{display:flex;gap:var(--s4);font-size:13px;margin-inline-start:auto;flex-wrap:wrap}

main{flex:1;padding:var(--s8);width:100%}
.doc{max-width:68ch;margin:0 auto}
h1{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1;
  font-variation-settings:"wdth" 108,"wght" 800;margin-bottom:var(--s4)}
.stamp{font-family:var(--mono);font-size:12px;color:var(--fg-3);margin-bottom:var(--s7);
  display:block;letter-spacing:.02em}
h2{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:var(--s7) 0 var(--s3)}
p{color:var(--fg-2);line-height:1.68;margin-bottom:var(--s4)}
ul{color:var(--fg-2);line-height:1.68;margin:0 0 var(--s4) 1.15em}
li{margin-bottom:9px}
li::marker{color:var(--signal)}
strong{color:var(--fg);font-weight:600}
.note{border-inline-start:2px solid var(--signal);padding:var(--s3) 0 var(--s3) var(--s4);
  margin:var(--s5) 0;background:var(--bg-2)}
.note p:last-child{margin-bottom:0}
code{font-family:var(--mono);font-size:.9em;color:var(--fg);background:var(--bg-2);
  padding:2px 5px;border-radius:3px}

.foot{border-top:1px solid var(--line);padding:var(--s6) var(--s8);
  display:flex;gap:var(--s4);flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--fg-3)}
.foot .sp{margin-inline-start:auto}
.langs{display:flex;gap:var(--s3);flex-wrap:wrap}
@media (max-width:820px){
  .head{padding:var(--s4)}
  main{padding:var(--s6) var(--s4)}
  .foot{padding:var(--s5) var(--s4)}
}
</style>
</head>
<body>
<header class="head">
  <a class="mark" href="{{home}}">AL<i>O</i>UD</a>
  <nav><!--NAV--></nav>
</header>
<main>
  <article class="doc">
<!--DOC-->
  </article>
</main>
<footer class="foot">
  <span>{{footer}}</span>
  <nav class="langs"><!--LANGS--></nav>
  <span class="sp"><a href="/sitemap.xml">{{sitemap}}</a></span>
</footer>
</body>
</html>
